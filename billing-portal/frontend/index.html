<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISP Billing Portal - Account Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 1200px;
            overflow: hidden;
        }

        /* Navigation */
        nav {
            background: #333;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            font-size: 24px;
        }

        nav button {
            background: #e74c3c;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        nav button:hover {
            background: #c0392b;
        }

        /* Main Content */
        .content {
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 25px;
            border-left: 4px solid #667eea;
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }

        .info-row label {
            font-weight: 600;
            color: #555;
        }

        .info-row span {
            color: #333;
        }

        /* Status Badge */
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .status-active {
            background: #2ecc71;
            color: white;
        }

        .status-expired {
            background: #e74c3c;
            color: white;
        }

        .status-expiring {
            background: #f39c12;
            color: white;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #764ba2;
        }

        .btn-renew {
            background: #2ecc71;
        }

        .btn-renew:hover {
            background: #27ae60;
        }

        .btn-danger {
            background: #e74c3c;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        /* Packages Grid */
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .package-card {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .package-card:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .package-card.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .package-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .package-price {
            color: #667eea;
            font-size: 18px;
            font-weight: 700;
        }

        .package-speed {
            color: #888;
            font-size: 12px;
        }

        /* Expiration Popup */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            margin: auto;
            padding: 40px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                transform: translate(-50%, -60%);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%);
                opacity: 1;
            }
        }

        .modal-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 28px;
            color: #e74c3c;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .modal-message {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .modal-buttons button {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-renew-modal {
            background: #2ecc71;
            color: white;
        }

        .btn-close-modal {
            background: #bbb;
            color: white;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }

            .packages-grid {
                grid-template-columns: 1fr;
            }

            nav {
                flex-direction: column;
                gap: 15px;
            }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #fdeaea;
            border-left: 4px solid #e74c3c;
            padding: 20px;
            border-radius: 5px;
            color: #c0392b;
            margin-bottom: 20px;
        }

        .success {
            background: #d4edda;
            border-left: 4px solid #2ecc71;
            padding: 20px;
            border-radius: 5px;
            color: #155724;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <nav>
            <h1>📡 ISP Billing Portal</h1>
            <button onclick="logout()">Logout</button>
        </nav>

        <!-- Main Content -->
        <div class="content" id="main-content">
            <div class="loading">Loading your account information...</div>
        </div>
    </div>

    <!-- Expiration Popup Modal -->
    <div id="expirationModal" class="modal">
        <div class="modal-content">
            <div class="modal-icon" id="modal-icon">⚠️</div>
            <h2 class="modal-title" id="modal-title">Account Expiring Soon!</h2>
            <p class="modal-message" id="modal-message">
                Your internet plan will expire in <strong id="days-remaining">3</strong> days.
                Please renew your subscription to maintain continuous service.
            </p>
            <div class="modal-buttons">
                <button class="btn-renew-modal" onclick="scrollToRenewal()">Renew Now</button>
                <button class="btn-close-modal" onclick="closeModal()">Dismiss</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        let currentUser = null;
        let billingStatus = null;
        let selectedPackage = null;

        // ============================================================
        // Initialize Portal
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            loadUserProfile();
            checkBillingStatus();
            setInterval(checkBillingStatus, 60000); // Check every minute
        });

        // ============================================================
        // Load User Profile
        // ============================================================
        async function loadUserProfile() {
            const token = localStorage.getItem('token');
            try {
                const response = await fetch(`${API_URL}/user/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Failed to load profile');
                currentUser = await response.json();
                displayUserProfile();
            } catch (error) {
                console.error('Error loading profile:', error);
                document.getElementById('main-content').innerHTML = 
                    `<div class="error">Failed to load profile. Please refresh the page.</div>`;
            }
        }

        // ============================================================
        // Display User Profile
        // ============================================================
        function displayUserProfile() {
            const html = `
                <div class="card">
                    <h2>Account Information</h2>
                    <div class="info-row">
                        <label>Username:</label>
                        <span>${currentUser.username}</span>
                    </div>
                    <div class="info-row">
                        <label>Email:</label>
                        <span>${currentUser.email}</span>
                    </div>
                    <div class="info-row">
                        <label>PPPoE Username:</label>
                        <span>${currentUser.pppoe_user}</span>
                    </div>
                    <div class="info-row">
                        <label>Current Plan:</label>
                        <span>${currentUser.package.name}</span>
                    </div>
                    <div class="info-row">
                        <label>Speed:</label>
                        <span>${currentUser.package.speed_mbps} Mbps</span>
                    </div>
                    <div class="info-row">
                        <label>Expiry Date:</label>
                        <span>${new Date(currentUser.expiry_date).toLocaleDateString()}</span>
                    </div>
                    <div class="info-row">
                        <label>Days Remaining:</label>
                        <span><strong>${currentUser.days_remaining} days</strong></span>
                    </div>
                    <div>
                        <span class="status-badge ${getStatusClass(currentUser.status)}">
                            ${currentUser.status}
                        </span>
                    </div>
                </div>

                <div class="card">
                    <h2 id="renewal-section">Renew Your Subscription</h2>
                    <div class="packages-grid" id="packages-grid">
                        <!-- Packages will be loaded here -->
                    </div>
                    <button class="btn btn-renew" onclick="renewSubscription()" style="width: 100%; margin-top: 20px;">
                        Renew Selected Plan
                    </button>
                </div>
            `;
            document.getElementById('main-content').innerHTML = html;
            loadPackages();
        }

        // ============================================================
        // Load Available Packages
        // ============================================================
        async function loadPackages() {
            const token = localStorage.getItem('token');
            try {
                // For demo purposes, we'll use hardcoded packages
                const packages = [
                    { id: 1, name: '20 Mbps', speed_mbps: 20, price: 10 },
                    { id: 2, name: '30 Mbps', speed_mbps: 30, price: 15 },
                    { id: 3, name: '50 Mbps', speed_mbps: 50, price: 25 },
                    { id: 4, name: '100 Mbps', speed_mbps: 100, price: 40 },
                    { id: 5, name: '200 Mbps', speed_mbps: 200, price: 70 },
                    { id: 6, name: '500 Mbps', speed_mbps: 500, price: 150 }
                ];

                let html = '';
                packages.forEach(pkg => {
                    const isSelected = pkg.id === currentUser.package_id ? 'selected' : '';
                    html += `
                        <div class="package-card ${isSelected}" onclick="selectPackage(${pkg.id}, this)">
                            <div class="package-name">${pkg.name}</div>
                            <div class="package-speed">${pkg.speed_mbps} Mbps</div>
                            <div class="package-price">$${pkg.price.toFixed(2)}</div>
                        </div>
                    `;
                    if (pkg.id === currentUser.package_id) {
                        selectedPackage = pkg.id;
                    }
                });

                document.getElementById('packages-grid').innerHTML = html;
            } catch (error) {
                console.error('Error loading packages:', error);
            }
        }

        // ============================================================
        // Select Package
        // ============================================================
        function selectPackage(packageId, element) {
            selectedPackage = packageId;
            document.querySelectorAll('.package-card').forEach(card => {
                card.classList.remove('selected');
            });
            element.classList.add('selected');
        }

        // ============================================================
        // Check Billing Status & Show Popup
        // ============================================================
        async function checkBillingStatus() {
            const token = localStorage.getItem('token');
            try {
                const response = await fetch(`${API_URL}/billing/status`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Failed to check billing status');
                billingStatus = await response.json();

                if (billingStatus.show_popup) {
                    showExpirationPopup();
                }
            } catch (error) {
                console.error('Error checking billing status:', error);
            }
        }

        // ============================================================
        // Show Expiration Popup
        // ============================================================
        function showExpirationPopup() {
            const modal = document.getElementById('expirationModal');
            const icon = document.getElementById('modal-icon');
            const title = document.getElementById('modal-title');
            const message = document.getElementById('modal-message');

            if (billingStatus.is_expired) {
                icon.textContent = '❌';
                title.textContent = 'Your Account Has Expired!';
                message.innerHTML = `
                    Your internet service has been suspended due to account expiration.
                    Please renew your subscription immediately to restore service.
                `;
            } else if (billingStatus.expiring_soon) {
                icon.textContent = '⚠️';
                title.textContent = 'Account Expiring Soon!';
                message.innerHTML = `
                    Your internet plan will expire in <strong>${billingStatus.days_remaining}</strong> day(s).
                    Please renew your subscription to maintain continuous service.
                `;
                document.getElementById('days-remaining').textContent = billingStatus.days_remaining;
            }

            modal.style.display = 'block';
        }

        // ============================================================
        // Close Modal
        // ============================================================
        function closeModal() {
            document.getElementById('expirationModal').style.display = 'none';
        }

        // ============================================================
        // Scroll to Renewal Section
        // ============================================================
        function scrollToRenewal() {
            closeModal();
            const element = document.getElementById('renewal-section');
            if (element) {
                element.scrollIntoView({ behavior: 'smooth' });
            }
        }

        // ============================================================
        // Renew Subscription
        // ============================================================
        async function renewSubscription() {
            if (!selectedPackage) {
                alert('Please select a plan');
                return;
            }

            const token = localStorage.getItem('token');
            try {
                const response = await fetch(`${API_URL}/billing/renew`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ package_id: selectedPackage })
                });

                if (!response.ok) throw new Error('Failed to renew subscription');
                const result = await response.json();

                alert('Subscription renewed successfully! Your new expiry date is: ' + 
                      new Date(result.new_expiry_date).toLocaleDateString());
                
                loadUserProfile();
                closeModal();
            } catch (error) {
                console.error('Error renewing subscription:', error);
                alert('Failed to renew subscription. Please try again.');
            }
        }

        // ============================================================
        // Logout
        // ============================================================
        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }

        // ============================================================
        // Get Status Class
        // ============================================================
        function getStatusClass(status) {
            if (status === 'active') return 'status-active';
            if (status === 'expired') return 'status-expired';
            if (status === 'expiring') return 'status-expiring';
            return 'status-active';
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('expirationModal');
            if (event.target === modal) {
                closeModal();
            }
        };
    </script>
</body>
</html>
